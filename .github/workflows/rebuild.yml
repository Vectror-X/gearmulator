name: Rebuild old version (Windows)

# Rebuilds a tagged release on today's GitHub runners: the 2024 workflows used windows-2019,
# which GitHub has retired. Same source as the tag, only the CI changed.
on:
  push:
    branches: ['rebuild-*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # 2024 code on a 2025 compiler: newer MSVC standard headers no longer pull in <chrono> and
      # friends by accident, so a few of the sources that relied on that fail. Force-including the
      # standard headers fixes it without touching a line of the emulator's source.
      - name: Configure
        env:
          CXXFLAGS: /FIchrono /FIcstdint /FIcstring /FIalgorithm /FIfunctional /FIarray /FIstdexcept
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }
      - name: Pack
        working-directory: build
        run: cmake -P ${{ github.workspace }}/scripts/pack.cmake
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gearmulator-${{ github.ref_name }}-windows
          path: build/*.zip
          if-no-files-found: error
